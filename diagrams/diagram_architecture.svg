<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 840" width="1060" height="840" style="background:#ffffff; font-family:'Sarabun', 'Prompt', 'Thonburi', -apple-system, BlinkMacSystemFont, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arch-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Header Banner -->
  <rect x="30" y="20" width="1000" height="75" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="530" y="50" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">รูปที่ 3.3: แผนภาพสถาปัตยกรรมระบบ (System Architecture Diagram)</text>
  <text x="530" y="74" text-anchor="middle" font-size="14" fill="#475569">โครงสร้างระบบเว็บแอปพลิเคชันแบบ 3 ชั้น (3-Tier Client-Side Web Architecture)</text>

  <!-- LAYER 1: Presentation Layer -->
  <rect x="40" y="115" width="980" height="190" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8" filter="url(#shadow)"/>
  <rect x="55" y="102" width="340" height="28" rx="6" fill="#1d4ed8"/>
  <text x="225" y="121" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#ffffff">1. ส่วนติดต่อผู้ใช้ (Presentation Layer - HTML5 / CSS3)</text>

  <!-- Layer 1 Cards -->
  <rect x="60" y="145" width="215" height="135" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="167" y="175" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">🔍 Search Bar Input</text>
  <text x="167" y="198" text-anchor="middle" font-size="12" fill="#475569">ช่องค้นหาภาษาธรรมชาติ</text>
  <text x="167" y="218" text-anchor="middle" font-size="11" fill="#64748b">รองรับการพิมพ์อิสระ</text>
  <text x="167" y="238" text-anchor="middle" font-size="11" fill="#64748b">พร้อมปุ่มคำค้นหาแนะนำ</text>

  <rect x="295" y="145" width="235" height="135" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="412" y="175" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">💡 Live Condition Bar</text>
  <text x="412" y="198" text-anchor="middle" font-size="12" fill="#475569">แถบสรุปเอนทิตี 4 มิติ</text>
  <text x="412" y="218" text-anchor="middle" font-size="11" fill="#64748b">แสดงผลตามการพิมพ์สด</text>
  <text x="412" y="238" text-anchor="middle" font-size="11" fill="#64748b">สถานี • สัตว์ • ไลฟ์สไตล์ • งบ</text>

  <rect x="550" y="145" width="215" height="135" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="657" y="175" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">🏢 Condo Cards Grid</text>
  <text x="657" y="198" text-anchor="middle" font-size="12" fill="#475569">ตารางผลลัพธ์โครงการ</text>
  <text x="657" y="218" text-anchor="middle" font-size="11" fill="#64748b">รูปภาพ • ป้ายสถานะ</text>
  <text x="657" y="238" text-anchor="middle" font-size="11" fill="#64748b">ระยะเดินเท้า • ราคาเช่า</text>

  <rect x="785" y="145" width="215" height="135" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="892" y="175" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">📄 Project Modal</text>
  <text x="892" y="198" text-anchor="middle" font-size="12" fill="#475569">หน้าต่างป๊อปอัปเชิงลึก</text>
  <text x="892" y="218" text-anchor="middle" font-size="11" fill="#64748b">สิ่งอำนวยความสะดวก</text>
  <text x="892" y="238" text-anchor="middle" font-size="11" fill="#64748b">รายละเอียดโครงการเต็ม</text>

  <!-- Connective Arrows 1 -> 2 -->
  <line x1="290" y1="305" x2="290" y2="345" stroke="#2563eb" stroke-width="2" marker-end="url(#arch-arrow)"/>
  <line x1="780" y1="345" x2="780" y2="305" stroke="#16a34a" stroke-width="2" marker-end="url(#arch-arrow)"/>
  <rect x="235" y="312" width="110" height="20" rx="4" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="290" y="326" text-anchor="middle" font-size="11" fill="#1d4ed8">User Input Events</text>
  <rect x="725" y="312" width="110" height="20" rx="4" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="780" y="326" text-anchor="middle" font-size="11" fill="#15803d">DOM UI Rendering</text>

  <!-- LAYER 2: Business & Application Logic Layer -->
  <rect x="40" y="345" width="980" height="245" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8" filter="url(#shadow)"/>
  <rect x="55" y="332" width="360" height="28" rx="6" fill="#6d28d9"/>
  <text x="235" y="351" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#ffffff">2. ส่วนประมวลผลตรรกะและค้นหา (Logic Layer - app.js)</text>

  <!-- Layer 2 Components -->
  <rect x="60" y="375" width="215" height="195" rx="8" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.2"/>
  <text x="167" y="405" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#5b21b6">🔤 Text Normalizer</text>
  <text x="80" y="432" font-size="11.5" fill="#334155">• ตัดช่องว่าง & สัญลักษณ์</text>
  <text x="80" y="452" font-size="11.5" fill="#334155">• ลบวรรณยุกต์เทียบเคียง</text>
  <text x="80" y="472" font-size="11.5" fill="#334155">• แปลงเป็นตัวพิมพ์เล็ก</text>
  <text x="80" y="492" font-size="11.5" fill="#334155">• ฟังก์ชัน normTh()</text>
  <text x="80" y="518" font-size="11" fill="#6d28d9">เตรียมสตริงก่อนการวิเคราะห์</text>

  <rect x="295" y="375" width="235" height="195" rx="8" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.2"/>
  <text x="412" y="405" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#5b21b6">🧠 Station & Zone NLP</text>
  <text x="315" y="432" font-size="11.5" fill="#334155">• Direct Substring Match</text>
  <text x="315" y="452" font-size="11.5" fill="#334155">• Levenshtein Distance</text>
  <text x="315" y="472" font-size="11.5" fill="#334155">• กลุ่มสถานีสุขุมวิท (58 แห่ง)</text>
  <text x="315" y="492" font-size="11.5" fill="#334155">• กลุ่มสถานีพหลโยธิน (28 แห่ง)</text>
  <text x="315" y="518" font-size="11" fill="#6d28d9">ป้องกันการแสดงผลข้ามโซน</text>

  <rect x="550" y="375" width="215" height="195" rx="8" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.2"/>
  <text x="657" y="405" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#5b21b6">🏷️ Multi-Entity Parser</text>
  <text x="570" y="432" font-size="11.5" fill="#334155">• สัตว์เลี้ยง: RegEx บวก/ลบ</text>
  <text x="570" y="452" font-size="11.5" fill="#334155">• ไลฟ์สไตล์: Taxonomy Map</text>
  <text x="570" y="472" font-size="11.5" fill="#334155">• งบประมาณ: RegEx Range/k</text>
  <text x="570" y="492" font-size="11.5" fill="#334155">• ระยะเดิน: Regex '...เมตร'</text>
  <text x="570" y="518" font-size="11" fill="#6d28d9">สกัด 4 มิติอัตโนมัติ</text>

  <rect x="785" y="375" width="215" height="195" rx="8" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.2"/>
  <text x="892" y="405" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#5b21b6">⚙️ Search & Filter Engine</text>
  <text x="805" y="432" font-size="11.5" fill="#334155">• Multi-Criteria Matching</text>
  <text x="805" y="452" font-size="11.5" fill="#334155">• Walking Distance Filter</text>
  <text x="805" y="472" font-size="11.5" fill="#334155">• Relevance Sorting Score</text>
  <text x="805" y="492" font-size="11.5" fill="#334155">• Default Showcase Condos</text>
  <text x="805" y="518" font-size="11" fill="#6d28d9">จัดอันดับความตรงเงื่อนไข</text>

  <!-- Connective Arrows 2 -> 3 -->
  <line x1="530" y1="590" x2="530" y2="630" stroke="#059669" stroke-width="2" marker-end="url(#arch-arrow)"/>
  <rect x="445" y="598" width="170" height="20" rx="4" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="530" y="612" text-anchor="middle" font-size="11" fill="#047857">Query / In-Memory Filter</text>

  <!-- LAYER 3: Data Storage Layer -->
  <rect x="40" y="630" width="980" height="135" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.8" filter="url(#shadow)"/>
  <rect x="55" y="617" width="320" height="28" rx="6" fill="#047857"/>
  <text x="215" y="636" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#ffffff">3. ส่วนจัดเก็บข้อมูล (Data Layer - data.js)</text>

  <rect x="60" y="655" width="940" height="95" rx="8" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.2"/>
  <text x="85" y="685" font-size="14.5" font-weight="bold" fill="#065f46">📦 CONDO_DATASET (Single-Entity Document Dataset 100 โครงการ)</text>
  <text x="85" y="710" font-size="12.5" fill="#334155">• โครงสร้างข้อมูล 10 แอตทริบิวต์: id, name, station, transitType, distance, price, petFriendly, lifestyle[], desc, image</text>
  <text x="85" y="730" font-size="12" fill="#047857">• ขอบเขตสถานี: BTS รถไฟฟ้าสายสีเขียวตลอดสาย (สถานีคูคต N24 ถึง สถานีเคหะฯ E23 รวม 47 สถานีหลัก)</text>

  <!-- Footer Credit -->
  <text x="530" y="805" text-anchor="middle" font-size="12" fill="#94a3b8">คณะเทคโนโลยีสารสนเทศและนวัตกรรมดิจิทัล มหาวิทยาลัยรังสิต • วาทินี วรรณกิจ (6707225)</text>
</svg>