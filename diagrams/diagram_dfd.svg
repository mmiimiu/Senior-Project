<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800" width="1100" height="800" style="background:#ffffff; font-family:'Sarabun', 'Prompt', 'Thonburi', -apple-system, BlinkMacSystemFont, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="flow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="flow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="40" y="20" width="1020" height="75" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="550" y="50" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">รูปที่ 3.4: แผนภาพกระแสข้อมูลระดับที่ 1 (Data Flow Diagram: DFD Level 1)</text>
  <text x="550" y="74" text-anchor="middle" font-size="14" fill="#475569">แสดงลำดับการไหลของข้อมูล 6 ขั้นตอนตามเข็มนาฬิกา (เข้าใจง่าย ชัดเจน ไม่ซับซ้อน)</text>

  <!-- External Entity: User (Left side) -->
  <g filter="url(#shadow)">
    <rect x="40" y="260" width="160" height="180" rx="10" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
    <rect x="40" y="260" width="160" height="35" rx="10" fill="#334155"/>
    <text x="120" y="283" text-anchor="middle" font-size="13" font-weight="bold" fill="#94a3b8">External Entity</text>
    <text x="120" y="335" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">👤 ผู้ใช้งาน</text>
    <text x="120" y="365" text-anchor="middle" font-size="13" fill="#93c5fd">(User / Condo Seeker)</text>
    <text x="120" y="405" text-anchor="middle" font-size="11.5" fill="#cbd5e1">ผู้ค้นหาห้องพักตามไลฟ์สไตล์</text>
  </g>

  <!-- PROCESS 1.0 (Top Left) -->
  <g filter="url(#shadow)">
    <rect x="360" y="140" width="280" height="105" rx="18" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <path d="M 360 175 L 640 175" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="3 3"/>
    <text x="500" y="164" text-anchor="middle" font-size="14" font-weight="bold" fill="#2563eb">1.0</text>
    <text x="500" y="200" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#0f172a">รับข้อความค้นหา</text>
    <text x="500" y="222" text-anchor="middle" font-size="12" fill="#64748b">ดักจับอีเวนต์การพิมพ์ และตัดช่องว่างส่วนเกิน</text>
  </g>

  <!-- PROCESS 2.0 (Top Right) -->
  <g filter="url(#shadow)">
    <rect x="750" y="140" width="290" height="105" rx="18" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <path d="M 750 175 L 1040 175" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="3 3"/>
    <text x="895" y="164" text-anchor="middle" font-size="14" font-weight="bold" fill="#2563eb">2.0</text>
    <text x="895" y="200" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#0f172a">สกัดเอนทิตีภาษาธรรมชาติ</text>
    <text x="895" y="222" text-anchor="middle" font-size="12" fill="#64748b">วิเคราะห์ 4 ด้าน: สถานี, สัตว์เลี้ยง, ไลฟ์สไตล์, งบ</text>
  </g>

  <!-- PROCESS 3.0 (Bottom Right) -->
  <g filter="url(#shadow)">
    <rect x="750" y="370" width="290" height="105" rx="18" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <path d="M 750 405 L 1040 405" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="3 3"/>
    <text x="895" y="394" text-anchor="middle" font-size="14" font-weight="bold" fill="#2563eb">3.0</text>
    <text x="895" y="430" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#0f172a">ค้นหาและคัดกรองข้อมูล</text>
    <text x="895" y="452" text-anchor="middle" font-size="12" fill="#64748b">เปรียบเทียบเงื่อนไขกับข้อมูลคอนโด 100 แห่ง</text>
  </g>

  <!-- PROCESS 4.0 (Bottom Left) -->
  <g filter="url(#shadow)">
    <rect x="360" y="370" width="280" height="105" rx="18" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <path d="M 360 405 L 640 405" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="3 3"/>
    <text x="500" y="394" text-anchor="middle" font-size="14" font-weight="bold" fill="#2563eb">4.0</text>
    <text x="500" y="430" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#0f172a">ประมวลผลและแสดงผลลัพธ์</text>
    <text x="500" y="452" text-anchor="middle" font-size="12" fill="#64748b">สร้างการ์ดห้องพัก และอัปเดตแถบสรุปเงื่อนไขสด</text>
  </g>

  <!-- DATA STORE D1 (Bottom Right) Gane-Sarson open box -->
  <g filter="url(#shadow)">
    <path d="M 750 590 L 1040 590 M 750 660 L 1040 660" stroke="#0f172a" stroke-width="2" fill="none"/>
    <rect x="680" y="590" width="70" height="70" fill="#0284c7"/>
    <rect x="750" y="590" width="290" height="70" fill="#f0f9ff"/>
    <text x="715" y="632" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">D1</text>
    <text x="895" y="618" text-anchor="middle" font-size="15" font-weight="bold" fill="#0369a1">คลังข้อมูลคอนโดมิเนียม 100 แห่ง</text>
    <text x="895" y="642" text-anchor="middle" font-size="12" fill="#0284c7">CONDO_DATASET (BTS สายสีเขียว 10 แอตทริบิวต์)</text>
  </g>

  <!-- ==================== DATA FLOW ARROWS (CLOCKWISE 1 -> 6) ==================== -->

  <!-- Flow 1: User -> Process 1.0 (From User Right side, goes UP then RIGHT into 1.0) -->
  <path d="M 200 320 L 250 320 L 250 192 L 360 192" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#flow-blue)"/>
  <rect x="175" y="167" width="155" height="24" rx="5" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="252" y="184" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">1. ข้อความภาษาธรรมชาติ</text>

  <!-- Flow 2: Process 1.0 -> Process 2.0 (Straight Right) -->
  <line x1="640" y1="192" x2="750" y2="192" stroke="#2563eb" stroke-width="2.2" marker-end="url(#flow-blue)"/>
  <rect x="640" y="167" width="110" height="24" rx="5" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="695" y="184" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">2. ข้อความที่คลีนแล้ว</text>

  <!-- Flow 3: Process 2.0 -> Process 3.0 (Straight Down) -->
  <line x1="895" y1="245" x2="895" y2="370" stroke="#2563eb" stroke-width="2.2" marker-end="url(#flow-blue)"/>
  <rect x="905" y="295" width="155" height="24" rx="5" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="982" y="312" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">3. เงื่อนไขค้นหา 4 ด้าน</text>

  <!-- Flow 4: Data Store D1 -> Process 3.0 (Straight Up) -->
  <line x1="895" y1="590" x2="895" y2="475" stroke="#0284c7" stroke-width="2.2" marker-end="url(#flow-blue)"/>
  <rect x="905" y="520" width="160" height="24" rx="5" fill="#f0f9ff" stroke="#bae6fd"/>
  <text x="985" y="537" text-anchor="middle" font-size="12" font-weight="bold" fill="#0369a1">4. ข้อมูลคอนโด 100 แห่ง</text>

  <!-- Flow 5: Process 3.0 -> Process 4.0 (Straight Left) -->
  <line x1="750" y1="422" x2="640" y2="422" stroke="#2563eb" stroke-width="2.2" marker-end="url(#flow-blue)"/>
  <rect x="640" y="397" width="110" height="24" rx="5" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="695" y="414" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">5. รายชื่อห้องที่ตรงใจ</text>

  <!-- Flow 6: Process 4.0 -> User (Straight Left into Right side of User box) -->
  <line x1="360" y1="422" x2="200" y2="422" stroke="#059669" stroke-width="2.2" marker-end="url(#flow-green)"/>
  <rect x="205" y="410" width="150" height="24" rx="5" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="280" y="427" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#15803d">6. การ์ดคอนโด &amp; สรุปเงื่อนไข</text>

  <!-- Footer Credit -->
  <text x="550" y="750" text-anchor="middle" font-size="12" fill="#94a3b8">คณะเทคโนโลยีสารสนเทศและนวัตกรรมดิจิทัล มหาวิทยาลัยรังสิต • วาทินี วรรณกิจ (6707225)</text>
</svg>