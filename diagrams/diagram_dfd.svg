<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 760" width="1060" height="760" style="background:#ffffff; font-family:'Sarabun', 'Prompt', 'Thonburi', -apple-system, BlinkMacSystemFont, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="dfd-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="dfd-arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Header Banner -->
  <rect x="30" y="20" width="1000" height="75" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="530" y="50" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">รูปที่ 3.2: แผนภาพกระแสข้อมูลระดับที่ 1 (Data Flow Diagram: DFD Level 1)</text>
  <text x="530" y="74" text-anchor="middle" font-size="14" fill="#475569">แสดงการไหลของข้อมูลระหว่างผู้ใช้งาน กระบวนการประมวลผลทางภาษา และคลังข้อมูลคอนโดมิเนียม</text>

  <!-- External Entity: User -->
  <rect x="40" y="260" width="170" height="140" rx="8" fill="#1e293b" stroke="#0f172a" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="260" width="170" height="35" rx="8" fill="#334155"/>
  <text x="125" y="283" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">External Entity</text>
  <text x="125" y="325" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">👤 ผู้ใช้งาน</text>
  <text x="125" y="350" text-anchor="middle" font-size="13" fill="#cbd5e1">(User / Room Seeker)</text>
  <text x="125" y="375" text-anchor="middle" font-size="11.5" fill="#94a3b8">ผู้ค้นหาห้องพักตามไลฟ์สไตล์</text>

  <!-- Process 1.0 -->
  <rect x="320" y="120" width="250" height="95" rx="18" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <path d="M 320 155 L 570 155" stroke="#2563eb" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="445" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563eb">1.0</text>
  <text x="445" y="180" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">รับคำค้นหาภาษาธรรมชาติ</text>
  <text x="445" y="200" text-anchor="middle" font-size="12" fill="#64748b">ตรวจจับการป้อนข้อมูล & ทำความสะอาดสตริง</text>

  <!-- Process 2.0 -->
  <rect x="720" y="120" width="280" height="105" rx="18" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <path d="M 720 155 L 1000 155" stroke="#2563eb" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="860" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563eb">2.0</text>
  <text x="860" y="178" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">สกัดเอนทิตีภาษาธรรมชาติ</text>
  <text x="860" y="198" text-anchor="middle" font-size="12" fill="#64748b">NLP Extraction (สถานี, สัตว์เลี้ยง, ไลฟ์สไตล์, งบ)</text>
  <text x="860" y="214" text-anchor="middle" font-size="11" fill="#3b82f6">Fuzzy Station / Regex Budget / Taxonomy</text>

  <!-- Process 3.0 -->
  <rect x="720" y="370" width="280" height="105" rx="18" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <path d="M 720 405 L 1000 405" stroke="#2563eb" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="860" y="395" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563eb">3.0</text>
  <text x="860" y="428" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">ประมวลผลและกรองข้อมูล</text>
  <text x="860" y="448" text-anchor="middle" font-size="12" fill="#64748b">Multi-Criteria Matching & Ranking</text>
  <text x="860" y="464" text-anchor="middle" font-size="11" fill="#16a34a">คัดกรองตามเงื่อนไข & คำนวณระยะเดินเท้า</text>

  <!-- Process 4.0 -->
  <rect x="320" y="370" width="250" height="105" rx="18" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <path d="M 320 405 L 570 405" stroke="#2563eb" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="445" y="395" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563eb">4.0</text>
  <text x="445" y="428" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">แสดงผลลัพธ์และรายละเอียด</text>
  <text x="445" y="448" text-anchor="middle" font-size="12" fill="#64748b">เรนเดอร์การ์ดผลการค้นหา & ป๊อปอัป</text>
  <text x="445" y="464" text-anchor="middle" font-size="11" fill="#9333ea">พร้อมแถบสรุปเอนทิตีอัตโนมัติ (Live Bar)</text>

  <!-- Data Store D1: Gane-Sarson open rectangle -->
  <g filter="url(#shadow)">
    <path d="M 650 600 L 980 600 M 650 670 L 980 670" stroke="#0f172a" stroke-width="2" fill="none"/>
    <rect x="550" y="600" width="80" height="70" fill="#0284c7"/>
    <rect x="630" y="600" width="350" height="70" fill="#f0f9ff"/>
    <text x="590" y="642" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">D1</text>
    <text x="805" y="630" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#0369a1">คลังข้อมูลคอนโดมิเนียม 100 แห่ง</text>
    <text x="805" y="652" text-anchor="middle" font-size="12" fill="#0284c7">CONDO_DATASET (BTS สายสีเขียว 10 ฟิลด์)</text>
  </g>

  <!-- FLOW ARROWS -->
  <!-- 1. User -> Process 1.0 -->
  <path d="M 125 260 L 125 167 L 320 167" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#dfd-arrow)"/>
  <rect x="150" y="145" width="145" height="22" rx="4" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="222" y="160" text-anchor="middle" font-size="11.5" fill="#1e40af">ข้อความภาษาธรรมชาติ</text>

  <!-- 2. Process 1.0 -> Process 2.0 -->
  <line x1="570" y1="167" x2="720" y2="167" stroke="#2563eb" stroke-width="2" marker-end="url(#dfd-arrow)"/>
  <rect x="585" y="145" width="120" height="22" rx="4" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="645" y="160" text-anchor="middle" font-size="11.5" fill="#1e40af">ข้อความที่คลีนแล้ว</text>

  <!-- 3. Process 2.0 -> Process 3.0 (Down) -->
  <line x1="860" y1="225" x2="860" y2="370" stroke="#2563eb" stroke-width="2" marker-end="url(#dfd-arrow)"/>
  <rect x="865" y="285" width="155" height="22" rx="4" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="942" y="300" text-anchor="middle" font-size="11.5" fill="#1e40af">วัตถุเงื่อนไขค้นหา 4 มิติ</text>

  <!-- 4. Process 2.0 -> Process 4.0 (Diagonal or bent for Live Monitor) -->
  <path d="M 740 225 L 520 370" fill="none" stroke="#9333ea" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#dfd-arrow)"/>
  <rect x="545" y="270" width="135" height="22" rx="4" fill="#ffffff" stroke="#e9d5ff"/>
  <text x="612" y="285" text-anchor="middle" font-size="11" fill="#7e22ce">สถานะเอนทิตีที่ตรวจพบ</text>

  <!-- 5. D1 -> Process 3.0 (Up) -->
  <path d="M 860 600 L 860 475" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#dfd-arrow)"/>
  <rect x="865" y="525" width="150" height="22" rx="4" fill="#ffffff" stroke="#bae6fd"/>
  <text x="940" y="540" text-anchor="middle" font-size="11.5" fill="#0369a1">ข้อมูลโครงการคอนโด 100 แห่ง</text>

  <!-- 6. Process 3.0 -> Process 4.0 (Left) -->
  <line x1="720" y1="422" x2="570" y2="422" stroke="#2563eb" stroke-width="2" marker-end="url(#dfd-arrow)"/>
  <rect x="585" y="402" width="125" height="22" rx="4" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="647" y="417" text-anchor="middle" font-size="11.5" fill="#1e40af">รายการห้องพักที่ตรงใจ</text>

  <!-- 7. Process 4.0 -> User (Left) -->
  <path d="M 320 422 L 210 422 L 210 380" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#dfd-arrow)"/>
  <rect x="180" y="432" width="130" height="22" rx="4" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="245" y="447" text-anchor="middle" font-size="11.5" fill="#1e40af">การ์ดผลลัพธ์ & สรุปเงื่อนไข</text>

  <!-- Footer Credit -->
  <text x="530" y="725" text-anchor="middle" font-size="12" fill="#94a3b8">คณะเทคโนโลยีสารสนเทศและนวัตกรรมดิจิทัล มหาวิทยาลัยรังสิต • วาทินี วรรณกิจ (6707225)</text>
</svg>