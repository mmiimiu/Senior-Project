<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" width="960" height="760" style="background:#ffffff; font-family:'Sarabun', 'Prompt', 'Thonburi', -apple-system, BlinkMacSystemFont, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Title Banner -->
  <rect x="30" y="20" width="900" height="75" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="480" y="50" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">รูปที่ 3.5: แผนภาพยูสเคสการใช้งานระบบ (Use Case Diagram)</text>
  <text x="480" y="74" text-anchor="middle" font-size="14" fill="#475569">แสดงฟังก์ชันการทำงานหลักที่ผู้ใช้งานสามารถปฏิสัมพันธ์กับระบบค้นหาคอนโดมิเนียม BKK CONDO NLP</text>

  <!-- System Boundary Box -->
  <rect x="310" y="120" width="590" height="590" rx="14" fill="#f8fafc" stroke="#3b82f6" stroke-width="2"/>
  <rect x="340" y="108" width="280" height="28" rx="6" fill="#2563eb"/>
  <text x="480" y="127" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#ffffff">ระบบค้นหาคอนโดมิเนียม BKK CONDO NLP</text>

  <!-- Actor: User (Stickman style in SVG) -->
  <g transform="translate(80, 290)" filter="url(#shadow)">
    <circle cx="60" cy="40" r="22" fill="#ffffff" stroke="#1e293b" stroke-width="2.5"/>
    <line x1="60" y1="62" x2="60" y2="130" stroke="#1e293b" stroke-width="3"/>
    <line x1="60" y1="85" x2="25" y2="110" stroke="#1e293b" stroke-width="2.5"/>
    <line x1="60" y1="85" x2="95" y2="110" stroke="#1e293b" stroke-width="2.5"/>
    <line x1="60" y1="130" x2="35" y2="190" stroke="#1e293b" stroke-width="2.5"/>
    <line x1="60" y1="130" x2="85" y2="190" stroke="#1e293b" stroke-width="2.5"/>
    <text x="60" y="225" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">👤 ผู้ใช้งานทั่วไป</text>
    <text x="60" y="245" text-anchor="middle" font-size="13" fill="#64748b">(Condo Seeker)</text>
  </g>

  <!-- Use Cases (Ovals) -->
  <!-- UC 1 -->
  <ellipse cx="605" cy="175" rx="180" ry="32" fill="#ffffff" stroke="#2563eb" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="605" y="180" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">UC1: ค้นหาด้วยภาษาธรรมชาติ (NLP Search)</text>

  <!-- UC 2 -->
  <ellipse cx="605" cy="265" rx="180" ry="32" fill="#ffffff" stroke="#2563eb" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="605" y="270" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">UC2: เลือกคำค้นหาด่วนแนะนำ (Quick Tags)</text>

  <!-- UC 3 -->
  <ellipse cx="605" cy="355" rx="180" ry="32" fill="#ffffff" stroke="#16a34a" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="605" y="360" text-anchor="middle" font-size="14" font-weight="bold" fill="#15803d">UC3: ดูแถบสรุปเอนทิตี 4 เงื่อนไข (Live Monitor)</text>

  <!-- UC 4 -->
  <ellipse cx="605" cy="445" rx="180" ry="32" fill="#ffffff" stroke="#2563eb" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="605" y="450" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">UC4: ดูรายการผลลัพธ์การ์ดคอนโดมิเนียม</text>

  <!-- UC 5 -->
  <ellipse cx="605" cy="535" rx="180" ry="32" fill="#ffffff" stroke="#2563eb" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="605" y="540" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">UC5: สลับดูคอนโดทั้งหมด 100 แห่ง (Toggle All)</text>

  <!-- UC 6 -->
  <ellipse cx="605" cy="625" rx="180" ry="32" fill="#ffffff" stroke="#7c3aed" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="605" y="630" text-anchor="middle" font-size="14" font-weight="bold" fill="#6d28d9">UC6: ดูรายละเอียดโครงการเชิงลึก (View Modal)</text>

  <!-- Actor to Use Cases Connection Lines -->
  <line x1="180" y1="350" x2="425" y2="175" stroke="#475569" stroke-width="1.6"/>
  <line x1="180" y1="355" x2="425" y2="265" stroke="#475569" stroke-width="1.6"/>
  <line x1="180" y1="365" x2="425" y2="355" stroke="#475569" stroke-width="1.6"/>
  <line x1="180" y1="375" x2="425" y2="445" stroke="#475569" stroke-width="1.6"/>
  <line x1="180" y1="385" x2="425" y2="535" stroke="#475569" stroke-width="1.6"/>
  <line x1="180" y1="395" x2="425" y2="625" stroke="#475569" stroke-width="1.6"/>
</svg>