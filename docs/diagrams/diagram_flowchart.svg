<svg xmlns="http://www.w3.org/2000/svg" viewBox="-250 0 1460 1460" width="1460" height="1460" style="font-family:'Sarabun', 'Prompt', 'Thonburi', -apple-system, BlinkMacSystemFont, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#e11d48"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- SOLID OPAQUE WHITE BACKGROUND (Ensures 100% visibility in dark IDE and Word) -->
  <rect x="-250" y="0" width="1460" height="1460" fill="#ffffff"/>

  <!-- Header Banner -->
  <rect x="30" y="25" width="900" height="80" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="480" y="58" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">แผนภาพขั้นตอนการทำงานของระบบ (System Flowchart)</text>
  <text x="480" y="84" text-anchor="middle" font-size="14" fill="#334155">กระบวนการสกัดเอนทิตีภาษาธรรมชาติและการจับคู่ข้อมูลคอนโดมิเนียมตามเกณฑ์ไลฟ์สไตล์</text>

  <!-- Start Node -->
  <rect x="250" y="135" width="460" height="60" rx="30" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>
  <text x="480" y="160" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">เริ่มต้น: ผู้ใช้งานพิมพ์ข้อความค้นหาภาษาธรรมชาติ</text>
  <text x="480" y="180" text-anchor="middle" font-size="12.5" fill="#e0e7ff">ตัวอย่าง: 'คอนโดใกล้หมอชิต เลี้ยงแมวได้ งบ 15000 วิวสวย เดินไม่เกิน 300 ม.'</text>

  <!-- Line to Step 1 -->
  <line x1="480" y1="195" x2="480" y2="225" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 1: Text Normalization -->
  <rect x="230" y="225" width="500" height="65" rx="10" fill="#f8fafc" stroke="#3b82f6" stroke-width="2"/>
  <text x="480" y="252" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#0f172a">1. การทำความสะอาดข้อความ (Text Normalization)</text>
  <text x="480" y="274" text-anchor="middle" font-size="13" fill="#334155">ตัดช่องว่างส่วนเกิน, ลบสัญลักษณ์พิเศษ, แปลงเป็นตัวพิมพ์เล็ก</text>

  <!-- Line to Subgraph -->
  <line x1="480" y1="290" x2="480" y2="325" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Subgraph Box: NLP Engine -->
  <rect x="40" y="325" width="880" height="305" rx="14" fill="#f8fafc" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="60" y="310" width="410" height="30" rx="6" fill="#2563eb"/>
  <text x="265" y="330" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">กระบวนการสกัดเอนทิตีภาษาธรรมชาติ (Entity Extraction)</text>

  <!-- 4 Parallel Extractors -->
  <!-- Box 1: Station -->
  <rect x="60" y="355" width="195" height="250" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="60" y="355" width="195" height="38" rx="8" fill="#eff6ff"/>
  <text x="157" y="379" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">📍 สถานีและระยะทาง</text>
  <text x="75" y="412" font-size="12.5" font-weight="bold" fill="#0f172a">• ค้นหาชื่อสถานี BTS</text>
  <text x="75" y="432" font-size="12" fill="#334155">  (Direct Match / Regex)</text>
  <text x="75" y="456" font-size="12.5" font-weight="bold" fill="#0f172a">• ตรวจจับการสะกดผิด</text>
  <text x="75" y="476" font-size="12" fill="#334155">  (Levenshtein Distance)</text>
  <text x="75" y="500" font-size="12.5" font-weight="bold" fill="#0f172a">• แยกกลุ่มโซนหลัก</text>
  <text x="75" y="520" font-size="12" fill="#334155">  (สุขุมวิท / พหลโยธิน)</text>
  <text x="75" y="544" font-size="12.5" font-weight="bold" fill="#0f172a">• สกัดระยะทางเดินเท้า</text>
  <text x="75" y="564" font-size="12" fill="#334155">  (เช่น ไม่เกิน 300 เมตร)</text>

  <!-- Box 2: Pet -->
  <rect x="275" y="355" width="195" height="250" rx="8" fill="#ffffff" stroke="#e11d48" stroke-width="2"/>
  <rect x="275" y="355" width="195" height="38" rx="8" fill="#fff1f2"/>
  <text x="372" y="379" text-anchor="middle" font-size="14" font-weight="bold" fill="#be123c">🐾 สัตว์เลี้ยง (Pet-Friendly)</text>
  <text x="290" y="412" font-size="12.5" font-weight="bold" fill="#0f172a">• ตรวจจับคำอนุญาต</text>
  <text x="290" y="432" font-size="12" fill="#334155">  (เลี้ยงสัตว์, สุนัข, หมา,</text>
  <text x="290" y="450" font-size="12" fill="#334155">   แมว, pet-friendly)</text>
  <text x="290" y="478" font-size="12.5" font-weight="bold" fill="#0f172a">• ตรวจจับคำปฏิเสธ</text>
  <text x="290" y="498" font-size="12" fill="#334155">  (ห้ามเลี้ยง, ไม่รับสัตว์,</text>
  <text x="290" y="516" font-size="12" fill="#334155">   no pets)</text>
  <text x="290" y="544" font-size="12.5" font-weight="bold" fill="#0f172a">• กำหนดค่าตรรกะ</text>
  <text x="290" y="564" font-size="12" fill="#334155">  (true / false / null)</text>

  <!-- Box 3: Lifestyle -->
  <rect x="490" y="355" width="195" height="250" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <rect x="490" y="355" width="195" height="38" rx="8" fill="#faf5ff"/>
  <text x="587" y="379" text-anchor="middle" font-size="14" font-weight="bold" fill="#6d28d9">✨ เกณฑ์ไลฟ์สไตล์</text>
  <text x="505" y="412" font-size="12.5" font-weight="bold" fill="#0f172a">• จับคู่พจนานุกรมคำศัพท์</text>
  <text x="505" y="432" font-size="12" fill="#334155">  (Lifestyle Taxonomy)</text>
  <text x="505" y="456" font-size="12.5" fill="#334155">• เหมาะกับ WFH / ห้องสมุด</text>
  <text x="505" y="478" font-size="12.5" fill="#334155">• ฟิตเนส / ว่ายน้ำ / ยิม</text>
  <text x="505" y="500" font-size="12.5" fill="#334155">• วิวเมืองสวย / สวนธรรมชาติ</text>
  <text x="505" y="522" font-size="12.5" fill="#334155">• เป็นส่วนตัว / สงบ เงียบ</text>
  <text x="505" y="544" font-size="12.5" fill="#334155">• ใกล้ห้าง / ของกิน แหล่งช้อป</text>
  <text x="505" y="564" font-size="12" fill="#6d28d9">  (คืนค่าเป็น Array แท็ก)</text>

  <!-- Box 4: Budget -->
  <rect x="705" y="355" width="195" height="250" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <rect x="705" y="355" width="195" height="38" rx="8" fill="#fffbeb"/>
  <text x="802" y="379" text-anchor="middle" font-size="14" font-weight="bold" fill="#b45309">💰 งบประมาณ (Budget)</text>
  <text x="720" y="412" font-size="12.5" font-weight="bold" fill="#0f172a">• สกัดช่วงราคา</text>
  <text x="720" y="432" font-size="12" fill="#334155">  (เช่น 10000 - 15000)</text>
  <text x="720" y="456" font-size="12.5" font-weight="bold" fill="#0f172a">• สกัดหน่วยย่อ 'k' หรือ 'หมื่น'</text>
  <text x="720" y="476" font-size="12" fill="#334155">  (เช่น 12k -> 12,000)</text>
  <text x="720" y="500" font-size="12.5" font-weight="bold" fill="#0f172a">• สกัดเพดานงบสูงสุด</text>
  <text x="720" y="520" font-size="12" fill="#334155">  (ไม่เกิน / คุมงบ / งบ)</text>
  <text x="720" y="544" font-size="12.5" font-weight="bold" fill="#0f172a">• คืนค่าตัวเลข</text>
  <text x="720" y="564" font-size="12" fill="#b45309">  (minPrice, maxPrice)</text>

  <!-- Convergence Lines from 4 boxes to Step 3 -->
  <path d="M 157 605 L 157 645 L 480 645" fill="none" stroke="#475569" stroke-width="2"/>
  <path d="M 372 605 L 372 645 L 480 645" fill="none" stroke="#475569" stroke-width="2"/>
  <path d="M 587 605 L 587 645 L 480 645" fill="none" stroke="#475569" stroke-width="2"/>
  <path d="M 802 605 L 802 645 L 480 645" fill="none" stroke="#475569" stroke-width="2"/>
  <line x1="480" y1="645" x2="480" y2="675" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 3: Synthesis & Live UI Sync -->
  <rect x="210" y="675" width="540" height="85" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="480" y="703" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#15803d">3. สรุปเป็นวัตถุเงื่อนไขค้นหา (Search Criteria Object)</text>
  <text x="480" y="726" text-anchor="middle" font-size="13" font-family="monospace" fill="#0f172a">{ station, petFriendly, lifestyle: [...], maxPrice, maxWalkDistance }</text>
  <text x="480" y="747" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#16a34a">💡 อัปเดตแถบสรุปเงื่อนไขอัตโนมัติบนหน้าจอทันที (Live Condition Monitor)</text>

  <!-- Line to Step 4 -->
  <line x1="480" y1="760" x2="480" y2="795" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 4: Multi-Criteria Filter with Dataset -->
  <!-- Side box for Dataset -->
  <rect x="755" y="775" width="170" height="75" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="840" y="801" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e40af">ฐานข้อมูล SQLite</text>
  <text x="840" y="820" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">condos.db</text>
  <text x="840" y="837" text-anchor="middle" font-size="11.5" fill="#334155">(100 แห่ง BTS สายสีเขียว)</text>
  <line x1="755" y1="815" x2="710" y2="815" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <rect x="235" y="795" width="470" height="65" rx="10" fill="#f8fafc" stroke="#4f46e5" stroke-width="2"/>
  <text x="470" y="822" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#3730a3">4. การประมวลผลคัดกรองข้อมูล (Criteria Filtering)</text>
  <text x="470" y="844" text-anchor="middle" font-size="13" fill="#334155">จับคู่และกรองข้อมูลแบบ Multi-Attribute Filtering (สถานี, สัตว์เลี้ยง, ไลฟ์สไตล์, ราคา)</text>

  <!-- Line to Decision -->
  <line x1="470" y1="860" x2="470" y2="895" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Decision Diamond -->
  <polygon points="470,895 650,945 470,995 290,945" fill="#fffbeb" stroke="#d97706" stroke-width="2.5"/>
  <text x="470" y="940" text-anchor="middle" font-size="15" font-weight="bold" fill="#92400e">พบคอนโดมิเนียม</text>
  <text x="470" y="960" text-anchor="middle" font-size="13.5" fill="#b45309">ที่ตรงตามเงื่อนไขหรือไม่?</text>

  <!-- Branch YES (Down) -->
  <line x1="470" y1="995" x2="470" y2="1045" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <rect x="480" y="1010" width="105" height="24" rx="4" fill="#dcfce7" stroke="#bbf7d0"/>
  <text x="532" y="1026" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">ใช่ (พบข้อมูล)</text>

  <!-- Step 5A: Ranking & Sorting -->
  <rect x="240" y="1045" width="460" height="65" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="470" y="1072" text-anchor="middle" font-size="15" font-weight="bold" fill="#15803d">5.1 จัดอันดับผลลัพธ์ (Relevance Ranking)</text>
  <text x="470" y="1094" text-anchor="middle" font-size="12.5" fill="#334155">เรียงลำดับตามความใกล้ของสถานี และจำนวนแท็กไลฟ์สไตล์ที่ตรงกัน</text>

  <!-- Branch NO (Right then Down) -->
  <line x1="650" y1="945" x2="825" y2="945" stroke="#e11d48" stroke-width="2.5"/>
  <line x1="825" y1="945" x2="825" y2="1045" stroke="#e11d48" stroke-width="2.5" marker-end="url(#arrow-rose)"/>
  <rect x="680" y="920" width="130" height="24" rx="4" fill="#ffe4e6" stroke="#fecdd3"/>
  <text x="745" y="936" text-anchor="middle" font-size="12" font-weight="bold" fill="#be123c">ไม่ใช่ (ไม่พบข้อมูล)</text>

  <!-- Step 5B: Fallback -->
  <rect x="725" y="1045" width="200" height="65" rx="10" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/>
  <text x="825" y="1072" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#be123c">5.2 แจ้งเตือนไม่พบข้อมูล</text>
  <text x="825" y="1094" text-anchor="middle" font-size="12" fill="#881337">แสดงคำค้นหาแนะนำ (Fallback)</text>

  <!-- Lines to Render Step -->
  <line x1="470" y1="1110" x2="470" y2="1155" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 825 1110 L 825 1155 L 705 1155" fill="none" stroke="#e11d48" stroke-width="2" marker-end="url(#arrow-rose)"/>

  <!-- Step 6: Render to UI -->
  <rect x="235" y="1155" width="470" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="470" y="1183" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#1d4ed8">6. เรนเดอร์ผลลัพธ์บนหน้าเว็บ (Render UI)</text>
  <text x="470" y="1205" text-anchor="middle" font-size="13" fill="#334155">แสดงการ์ดคอนโดมิเนียม, ราคา, ระยะเดินเท้า, ป้ายสัตว์เลี้ยง, ปุ่มดูรายละเอียด</text>

  <!-- Line to End -->
  <line x1="470" y1="1225" x2="470" y2="1265" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- End Node -->
  <rect x="260" y="1265" width="420" height="60" rx="30" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
  <text x="470" y="1292" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#ffffff">สิ้นสุด: ผู้ใช้งานได้รับรายการห้องพักที่ตรงใจ</text>
  <text x="470" y="1312" text-anchor="middle" font-size="12" fill="#cbd5e1">สามารถคลิกเปิดหน้าต่าง Modal เพื่อดูรายละเอียดเชิงลึกของแต่ละโครงการได้</text>

  <!-- Footer Credit -->
  <text x="480" y="1380" text-anchor="middle" font-size="12.5" fill="#475569">วิทยาลัยนวัตกรรมดิจิทัลเทคโนโลยี มหาวิทยาลัยรังสิต • นางสาว วาธิณีย์ วรรณกิจ (6707225)</text>
</svg>