<svg xmlns="http://www.w3.org/2000/svg" viewBox="-110 0 1180 1180" width="1180" height="1180" style="font-family:'Sarabun', 'Prompt', 'Thonburi', -apple-system, BlinkMacSystemFont, sans-serif;">
  <defs>
    <marker id="flow-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="flow-arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="flow-arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- SOLID OPAQUE WHITE BACKGROUND (Ensures 100% visibility in dark IDE and Word) -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Title Banner -->
  <rect x="30" y="20" width="900" height="75" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="480" y="50" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">แผนภาพลำดับขั้นตอนการใช้งานของผู้ใช้ (User Flow Diagram)</text>
  <text x="480" y="74" text-anchor="middle" font-size="14" fill="#334155">แสดงขั้นตอนการใช้งานจริงบนหน้าเว็บ BKK CONDO NLP ตั้งแต่เริ่มต้นจนถึงการดูข้อมูลห้องพัก</text>

  <!-- Step 1: Start Pill -->
  <rect x="310" y="120" width="340" height="55" rx="27.5" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>
  <text x="480" y="154" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">เริ่มต้น: เข้าสู่หน้าเว็บ BKK CONDO</text>

  <line x1="480" y1="175" x2="480" y2="210" stroke="#2563eb" stroke-width="2.5" marker-end="url(#flow-arrow)"/>

  <!-- Step 2: Default Screen Box -->
  <rect x="240" y="210" width="480" height="70" rx="10" fill="#f8fafc" stroke="#3b82f6" stroke-width="2"/>
  <text x="480" y="238" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#0f172a">1. ดูหน้าจอเริ่มต้นของระบบ (Initial Screen)</text>
  <text x="480" y="260" text-anchor="middle" font-size="13" fill="#334155">แสดงคอนโดแนะนำ 6 โครงการแรกตามแนวรถไฟฟ้า BTS สายสีเขียว</text>

  <line x1="480" y1="280" x2="480" y2="315" stroke="#2563eb" stroke-width="2.5" marker-end="url(#flow-arrow)"/>

  <!-- Decision 1: Search method -->
  <polygon points="480,315 670,365 480,415 290,365" fill="#fffbeb" stroke="#d97706" stroke-width="2.5"/>
  <text x="480" y="358" text-anchor="middle" font-size="15" font-weight="bold" fill="#92400e">เลือกรูปแบบการค้นหา?</text>
  <text x="480" y="378" text-anchor="middle" font-size="13" fill="#b45309">(พิมพ์เอง หรือ กดแท็กแนะนำ)</text>

  <!-- Branch Left: Quick Tag -->
  <path d="M 290 365 L 165 365 L 165 450" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#flow-arrow)"/>
  <rect x="180" y="340" width="105" height="24" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="232" y="356" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1d4ed8">กดแท็กด่วน</text>

  <rect x="45" y="450" width="240" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="165" y="478" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1d4ed8">2A. คลิกปุ่มคำค้นหาแนะนำ</text>
  <text x="165" y="500" text-anchor="middle" font-size="12.5" fill="#334155">เช่น 'สะพานใหม่ ติดรถไฟฟ้า'</text>

  <!-- Branch Right: Custom Text -->
  <path d="M 670 365 L 795 365 L 795 450" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#flow-arrow)"/>
  <rect x="675" y="340" width="115" height="24" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="732" y="356" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1d4ed8">พิมพ์ด้วยภาษาพูด</text>

  <rect x="675" y="450" width="240" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="795" y="478" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1d4ed8">2B. พิมพ์ข้อความค้นหาเอง</text>
  <text x="795" y="500" text-anchor="middle" font-size="12.5" fill="#334155">ระบุสถานี สัตว์ ไลฟ์สไตล์ งบ</text>

  <!-- Converge to Step 3 -->
  <path d="M 165 520 L 165 565 L 480 565" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <path d="M 795 520 L 795 565 L 480 565" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="480" y1="565" x2="480" y2="595" stroke="#2563eb" stroke-width="2.5" marker-end="url(#flow-arrow)"/>

  <!-- Step 3: Observe Live Monitor -->
  <rect x="200" y="595" width="560" height="80" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="480" y="625" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#15803d">3. สังเกตแถบสรุปเงื่อนไขอัตโนมัติ (Live Condition Bar)</text>
  <text x="480" y="650" text-anchor="middle" font-size="13" fill="#1e293b">ระบบแสดงเงื่อนไขที่ AI ตรวจจับได้ทันที: สถานี • สัตว์เลี้ยง • ไลฟ์สไตล์ • งบประมาณ</text>

  <line x1="480" y1="675" x2="480" y2="710" stroke="#2563eb" stroke-width="2.5" marker-end="url(#flow-arrow)"/>

  <!-- Step 4: Browse Results -->
  <rect x="200" y="710" width="560" height="75" rx="10" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/>
  <text x="480" y="740" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#1d4ed8">4. เลื่อนดูรายการการ์ดคอนโดมิเนียม (Browse Results)</text>
  <text x="480" y="763" text-anchor="middle" font-size="13" fill="#334155">เปรียบเทียบรูปภาพ, ระยะเดินเท้าถึง BTS, ค่าเช่าต่อเดือน, และแท็กไลฟ์สไตล์</text>

  <line x1="480" y1="785" x2="480" y2="820" stroke="#2563eb" stroke-width="2.5" marker-end="url(#flow-arrow)"/>

  <!-- Decision 2: Next Action -->
  <polygon points="480,820 670,870 480,920 290,870" fill="#fffbeb" stroke="#d97706" stroke-width="2.5"/>
  <text x="480" y="863" text-anchor="middle" font-size="15" font-weight="bold" fill="#92400e">สนใจโครงการใดเป็นพิเศษ?</text>
  <text x="480" y="883" text-anchor="middle" font-size="13" fill="#b45309">(คลิกดูข้อมูลเชิงลึก หรือ ค้นหาใหม่)</text>

  <!-- Branch Left: Open Modal -->
  <path d="M 290 870 L 165 870 L 165 955" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#flow-arrow-green)"/>
  <rect x="175" y="845" width="110" height="24" rx="4" fill="#dcfce7" stroke="#bbf7d0"/>
  <text x="230" y="861" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#15803d">ดูข้อมูลเชิงลึก</text>

  <rect x="40" y="955" width="250" height="70" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="165" y="983" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#15803d">5A. เปิด Modal ดูรายละเอียด</text>
  <text x="165" y="1005" text-anchor="middle" font-size="12.5" fill="#334155">ดูรูปขนาดใหญ่ สิ่งอำนวยความสะดวก &amp; รีวิว</text>

  <!-- Branch Right: Search Again / Toggle All -->
  <path d="M 670 870 L 795 870 L 795 955" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#flow-arrow-gray)"/>
  <rect x="675" y="845" width="115" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="732" y="861" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#334155">เปลี่ยนคำค้นหา</text>

  <rect x="670" y="955" width="250" height="70" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="795" y="983" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1e293b">5B. ปรับคำค้นหาใหม่</text>
  <text x="795" y="1005" text-anchor="middle" font-size="12.5" fill="#334155">หรือกดปุ่มดูคอนโดทั้งหมด 100 แห่ง</text>

  <!-- Converge to End -->
  <path d="M 165 1025 L 165 1065 L 480 1065" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <path d="M 795 1025 L 795 1065 L 480 1065" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="480" y1="1065" x2="480" y2="1090" stroke="#2563eb" stroke-width="2.5" marker-end="url(#flow-arrow)"/>

  <!-- End Node -->
  <rect x="300" y="1090" width="360" height="55" rx="27.5" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
  <text x="480" y="1124" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">สิ้นสุด: ผู้ใช้ตัดสินใจเลือกห้องพัก</text>
</svg>