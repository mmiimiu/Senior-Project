<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" style="font-family:'Sarabun', 'Prompt', 'Thonburi', -apple-system, BlinkMacSystemFont, sans-serif;">
  <defs>
    <marker id="arrow-down" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-up" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- SOLID OPAQUE WHITE BACKGROUND -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Title Banner -->
  <rect x="30" y="20" width="940" height="75" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="500" y="50" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">แผนภาพสถาปัตยกรรมระบบ (System Architecture Diagram)</text>
  <text x="500" y="74" text-anchor="middle" font-size="14" fill="#334155">สถาปัตยกรรมเว็บแอปพลิเคชัน 3 ชั้น (Next.js Frontend + Python FastAPI NLP + SQLite Database)</text>

  <!-- ==================== TIER 1: PRESENTATION TIER ==================== -->
  <rect x="40" y="115" width="920" height="165" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <rect x="55" y="102" width="470" height="28" rx="6" fill="#1d4ed8"/>
  <text x="290" y="121" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#ffffff">ชั้นที่ 1: ส่วนติดต่อผู้ใช้ (Presentation Tier - Next.js / React TypeScript)</text>

  <rect x="60" y="145" width="205" height="115" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <text x="162" y="182" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#1e3a8a">🔍 SearchHero.tsx</text>
  <text x="162" y="210" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#0f172a">ช่องค้นหาภาษาธรรมชาติ</text>
  <text x="162" y="232" text-anchor="middle" font-size="12" fill="#475569">รับข้อความพิมพ์และปุ่มลัด</text>

  <rect x="285" y="145" width="215" height="115" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <text x="392" y="182" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#1e3a8a">💡 CriteriaMonitor.tsx</text>
  <text x="392" y="210" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#0f172a">แถบสรุป 4 เงื่อนไขสด</text>
  <text x="392" y="232" text-anchor="middle" font-size="12" fill="#475569">แสดงผลการวิเคราะห์ทันที</text>

  <rect x="520" y="145" width="215" height="115" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <text x="627" y="182" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#1e3a8a">🏢 CondoGrid.tsx</text>
  <text x="627" y="210" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#0f172a">การ์ดแสดงผลลัพธ์ห้องพัก</text>
  <text x="627" y="232" text-anchor="middle" font-size="12" fill="#475569">รูปภาพ ราคา ระยะเดิน แท็ก</text>

  <rect x="755" y="145" width="185" height="115" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <text x="847" y="182" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#1e3a8a">📄 Modals.tsx</text>
  <text x="847" y="210" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#0f172a">ป๊อปอัปดูข้อมูลเชิงลึก</text>
  <text x="847" y="232" text-anchor="middle" font-size="12" fill="#475569">รายละเอียดโครงการเต็ม</text>

  <!-- ==================== CONNECTORS 1 <-> 2 ==================== -->
  <line x1="330" y1="280" x2="330" y2="340" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-down)"/>
  <rect x="200" y="295" width="260" height="24" rx="5" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="330" y="312" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">⬇️ HTTP POST /api/search/nlp (JSON)</text>

  <line x1="670" y1="340" x2="670" y2="280" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow-up)"/>
  <rect x="540" y="295" width="260" height="24" rx="5" fill="#f0fdf4" stroke="#86efac"/>
  <text x="670" y="312" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">⬆️ JSON Response (Results &amp; 4D Summary)</text>

  <!-- ==================== TIER 2: APPLICATION & NLP LOGIC TIER ==================== -->
  <rect x="40" y="340" width="920" height="175" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <rect x="55" y="327" width="490" height="28" rx="6" fill="#6d28d9"/>
  <text x="300" y="346" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#ffffff">ชั้นที่ 2: ส่วนประมวลผล API และ NLP (Application Tier - Python FastAPI)</text>

  <rect x="60" y="370" width="205" height="125" rx="8" fill="#ffffff" stroke="#ddd6fe" stroke-width="2"/>
  <text x="162" y="404" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#5b21b6">🔤 PyThaiNLP Tokenizer</text>
  <text x="162" y="432" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#0f172a">ตัดคำและจัดระเบียบข้อความ</text>
  <text x="162" y="454" text-anchor="middle" font-size="12" fill="#475569">อัลกอริทึม newmm + normalize</text>
  <text x="162" y="474" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7c3aed">backend/services/nlp_engine.py</text>

  <rect x="285" y="370" width="215" height="125" rx="8" fill="#ffffff" stroke="#ddd6fe" stroke-width="2"/>
  <text x="392" y="404" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#5b21b6">🧠 Station &amp; Fuzzy NLP</text>
  <text x="392" y="432" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#0f172a">ค้นหาสถานีและแก้คำพิมพ์ผิด</text>
  <text x="392" y="454" text-anchor="middle" font-size="12" fill="#475569">Levenshtein Distance</text>
  <text x="392" y="474" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7c3aed">BTS สายสีเขียว 47 สถานี</text>

  <rect x="520" y="370" width="215" height="125" rx="8" fill="#ffffff" stroke="#ddd6fe" stroke-width="2"/>
  <text x="627" y="404" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#5b21b6">🏷️ 4D Entity Extractor</text>
  <text x="627" y="432" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#0f172a">สกัดเงื่อนไข 4 มิติ</text>
  <text x="627" y="454" text-anchor="middle" font-size="12" fill="#475569">ทำเล • สัตว์เลี้ยง • ไลฟ์สไตล์ • งบ</text>
  <text x="627" y="474" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7c3aed">Regex &amp; Lifestyle Taxonomy</text>

  <rect x="755" y="370" width="185" height="125" rx="8" fill="#ffffff" stroke="#ddd6fe" stroke-width="2"/>
  <text x="847" y="404" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#5b21b6">⚙️ Hybrid Ranking</text>
  <text x="847" y="432" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#0f172a">จัดอันดับความตรงใจ</text>
  <text x="847" y="454" text-anchor="middle" font-size="12" fill="#475569">Scikit-learn TF-IDF</text>
  <text x="847" y="474" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7c3aed">Cosine Similarity Score</text>

  <!-- ==================== CONNECTORS 2 <-> 3 ==================== -->
  <line x1="500" y1="515" x2="500" y2="575" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-down)"/>
  <rect x="335" y="530" width="330" height="24" rx="5" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="500" y="547" text-anchor="middle" font-size="12" font-weight="bold" fill="#047857">↕️ สืบค้นฐานข้อมูล SQLite ผ่านโมดูล backend/data/database.py</text>

  <!-- ==================== TIER 3: DATA STORAGE TIER ==================== -->
  <rect x="40" y="575" width="920" height="165" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <rect x="55" y="562" width="465" height="28" rx="6" fill="#047857"/>
  <text x="287" y="581" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#ffffff">ชั้นที่ 3: ส่วนจัดเก็บฐานข้อมูล (Data Tier - SQLite: backend/data/condos.db)</text>

  <rect x="60" y="605" width="430" height="115" rx="8" fill="#ffffff" stroke="#a7f3d0" stroke-width="2"/>
  <text x="275" y="638" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#065f46">🗄️ ฐานข้อมูล SQLite (ตาราง condominiums)</text>
  <text x="275" y="664" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#0f172a">ชุดข้อมูลคอนโดมิเนียมจริง 100 โครงการ</text>
  <text x="275" y="686" text-anchor="middle" font-size="12" fill="#475569">จัดเก็บในฐานข้อมูลเชิงสัมพันธ์ (Relational SQLite DB)</text>
  <text x="275" y="705" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#059669">โหลดและประมวลผลเวกเตอร์รวดเร็ว (&lt; 35 ms)</text>

  <rect x="510" y="605" width="430" height="115" rx="8" fill="#ffffff" stroke="#a7f3d0" stroke-width="2"/>
  <text x="725" y="638" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#065f46">🏷️ โครงสร้างตาราง 10 ฟิลด์หลัก (Table Schema)</text>
  <text x="725" y="664" text-anchor="middle" font-size="13" font-family="monospace" fill="#0f172a">id, name, station, transit_type, distance, price,</text>
  <text x="725" y="685" text-anchor="middle" font-size="13" font-family="monospace" fill="#0f172a">pet_friendly, lifestyle_json, description, image</text>
  <text x="725" y="705" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#059669">ครอบคลุม BTS สายสีเขียว 47 สถานี (คูคต - เคหะฯ)</text>

  <!-- Footer Credit -->
  <text x="500" y="795" text-anchor="middle" font-size="12.5" fill="#475569">วิทยาลัยนวัตกรรมดิจิทัลเทคโนโลยี มหาวิทยาลัยรังสิต • นางสาว วาธิณีย์ วรรณกิจ (6707225)</text>
</svg>
