services:
  - type: web
    name: thai-nlp-condo-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.api.routes:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/info
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
